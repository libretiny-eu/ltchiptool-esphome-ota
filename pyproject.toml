[tool.poetry]
name = "ltchiptool-esphome-ota"
version = "1.4.0"
description = "ESPHome OTA uploader plugin for ltchiptool"
authors = ["Kuba Szczodrzyński <kuba@szczodrzynski.pl>"]
license = "MIT"
readme = "README.md"
packages = [
    { include = "ltctplugin/esphomeota" },
]

[tool.poetry.dependencies]
python = "^3.10"

[tool.poetry.group.dev.dependencies]
black = "^26.10.1"
isort = "^9.0.2"
autoflake = "^2.4.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
